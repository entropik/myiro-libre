[package]
name = "bibliotheque"
version = "0.1.0"
description = "Bibliothèque locale : conditions d'impression, instruments et mesures (ADR 0001)"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pont-protocole = { path = "../pont-protocole" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
