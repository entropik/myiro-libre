[package]
name = "app"
version = "0.1.0"
description = "Application de bureau myiro-libre (Tauri 2, ADR 0003)"
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "myiro-libre"

[lib]
name = "app"
path = "src/lib.rs"

[[bin]]
name = "myiro-libre"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[dev-dependencies]
serde_json = "1"
