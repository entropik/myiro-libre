[package]
name = "app"
version = "0.1.0"
description = "Application de bureau myiro-libre (Tauri 2, ADR 0003)"
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "myiro-libre"

[lib]
name = "app"
path = "src/lib.rs"

[[bin]]
name = "myiro-libre"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
bibliotheque = { path = "../crates/bibliotheque" }
cgats = { path = "../crates/cgats" }
mires = { path = "../crates/mires" }
colorimetrie = { path = "../crates/colorimetrie" }
gamut = { path = "../crates/gamut" }
photo = { path = "../crates/photo" }
profilage = { path = "../crates/profilage" }
rapport = { path = "../crates/rapport" }
# Logo de l'atelier : PNG ou JPEG lu, réduit et réencodé en PNG (#89).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pont-protocole = { path = "../crates/pont-protocole" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Vue 3D du rapport, reçue de la page en PNG base 64 (#89).
base64 = "0.22"

[dev-dependencies]
# Images d'essai construites en mémoire par les tests (aucune n'est écrite).
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
tempfile = "3"
