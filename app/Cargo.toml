[package]
name = "app"
version = "0.1.0"
description = "Application de bureau myiro-libre (Tauri 2, ADR 0003)"
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "myiro-libre"

[lib]
name = "app"
path = "src/lib.rs"

[[bin]]
name = "myiro-libre"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
bibliotheque = { path = "../crates/bibliotheque" }
cgats = { path = "../crates/cgats" }
mires = { path = "../crates/mires" }
colorimetrie = { path = "../crates/colorimetrie" }
gamut = { path = "../crates/gamut" }
photo = { path = "../crates/photo" }
profilage = { path = "../crates/profilage" }
pont-protocole = { path = "../crates/pont-protocole" }
verification = { path = "../crates/verification" }
serde = { version = "1", features = ["derive"] }
# Nombres relus à l'identique : un calcul de vérification rangé en JSON
# redonne le même rapport à l'octet.
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
# Images d'essai construites en mémoire par les tests (aucune n'est écrite).
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
tempfile = "3"
